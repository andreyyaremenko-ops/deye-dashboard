# Продакшн. Домен і секрети — у deploy/.env (див. .env.example). Запуск: docker compose up -d
# Сайти/мережі, специфічні для конкретного сервера, — у docker-compose.override.yml і caddy-extra/ (поза git).
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in deploy/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy-extra:/etc/caddy/extra:ro
      - caddy_data:/data
      - caddy_config:/config
      - web_dist:/srv/web:ro
      - tv_dist:/srv/tv:ro
      - media:/media:ro
    networks: [app]

  # копіює серти Caddy для Mosquitto під сталими іменами server.crt/server.key (раз на годину)
  certsync:
    image: alpine:3
    restart: unless-stopped
    command: sh -c 'while true; do for e in crt key; do cp /data/caddy/certificates/*/${DOMAIN}/${DOMAIN}.$$e /certs/server.$$e 2>/dev/null; done; chmod 644 /certs/* 2>/dev/null; sleep 3600; done'
    volumes:
      - caddy_data:/data:ro
      - certs:/certs
    networks: [app]

  postgres:
    image: timescale/timescaledb:2.21.0-pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: deye
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: deye
    # timescaledb-tune рахує пам'ять лише при першій ініціалізації тому (сервер тоді мав 2 GB), тому
    # ключові параметри тримаємо тут. Під 7.8 GB RAM / 12 vCPU і hypertable telemetry на кілька GB.
    command: >-
      postgres -c max_connections=40
      -c shared_buffers=2GB -c effective_cache_size=5GB -c work_mem=24MB -c maintenance_work_mem=512MB
      -c max_worker_processes=32 -c max_parallel_workers=8 -c max_parallel_workers_per_gather=4
    shm_size: 1gb
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deye"]
      interval: 10s
      retries: 10
    networks: [app]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --maxmemory 32mb --maxmemory-policy allkeys-lru
    networks: [app]

  mosquitto:
    image: iegomez/mosquitto-go-auth:latest
    restart: unless-stopped
    ports: ["8883:8883"]
    volumes:
      - ./mosquitto/mosquitto.conf:/etc/mosquitto/mosquitto.conf:ro
      - certs:/certs:ro
      - mosq_data:/mosquitto/data
    depends_on: [api]
    networks: [app]

  api:
    build: { context: .., dockerfile: apps/api/Dockerfile }
    restart: unless-stopped
    ports: ["10000:10000"]          # Solarman-стіки в режимі push (Server B), TCP
    env_file: .env
    environment:
      PUBLIC_URL: https://${DOMAIN}
      DATABASE_URL: postgres://deye:${POSTGRES_PASSWORD}@postgres:5432/deye
      REDIS_URL: redis://redis:6379
      MQTT_URL: mqtt://mosquitto:1883
      MEDIA_ROOT: /media
      NODE_ENV: production
    volumes: [media:/media]
    depends_on:
      postgres: { condition: service_healthy }
    deploy: { resources: { limits: { memory: 256M } } }
    networks: [app]

  # статика: docker compose run --rm static
  static:
    build:
      context: ..
      dockerfile: deploy/static.Dockerfile
      args:
        VITE_GA_ID: ${GA_ID:-}
        VITE_STICK_HOST: ${STICK_HOST:-}
        VITE_GOOGLE_SITE_VERIFICATION: ${GOOGLE_SITE_VERIFICATION:-}
    profiles: [tools]
    volumes:
      - web_dist:/srv/web
      - tv_dist:/srv/tv

  # ffmpeg-черга; імпорт стандартних фонів:
  #   docker compose run --rm worker node --experimental-strip-types src/import-pexels.ts
  worker:
    build: { context: .., dockerfile: apps/worker/Dockerfile }
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://deye:${POSTGRES_PASSWORD}@postgres:5432/deye
      MEDIA_ROOT: /media
    volumes: [media:/media]
    depends_on:
      postgres: { condition: service_healthy }
    deploy: { resources: { limits: { memory: 768M } } }
    networks: [app]

networks:
  app:

volumes:
  caddy_data:
  caddy_config:
  certs:
  pgdata:
  mosq_data:
  media:
  web_dist:
  tv_dist:
