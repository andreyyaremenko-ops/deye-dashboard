# Prod: TLS на 8883 сертифікатом Caddy, auth/ACL через go-auth -> API.
per_listener_settings false
persistence true
persistence_location /mosquitto/data/

listener 8883
certfile /certs/server.crt
keyfile  /certs/server.key
tls_version tlsv1.2

# внутрішній listener для API (тільки docker-мережа)
listener 1883
allow_anonymous false

auth_plugin /mosquitto/go-auth.so
auth_opt_backends http
auth_opt_http_host api
auth_opt_http_port 3000
auth_opt_http_getuser_uri /internal/mqtt/auth
auth_opt_http_aclcheck_uri /internal/mqtt/acl
auth_opt_http_superuser_uri /internal/mqtt/superuser
auth_opt_cache true
auth_opt_auth_cache_seconds 300
auth_opt_acl_cache_seconds 300

max_connections -1
max_inflight_messages 20
max_queued_messages 100
message_size_limit 4096
