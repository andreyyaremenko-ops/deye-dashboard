; Прошивка спайку: ESP8266 (Wemos D1 mini) і ESP32 з одного коду.
;   pio run -e d1_mini -t upload      ; прошити D1 mini
;   pio device monitor -b 115200
;   pio test -e native                ; unit-тести парсера V5 на реальних дампах

[platformio]
default_envs = d1_mini

[env]
monitor_speed = 115200

[arduino]
framework = arduino
lib_deps =
    tzapu/WiFiManager @ ^2.0.17
    knolleary/PubSubClient @ ^2.8
    bblanchon/ArduinoJson @ ^7.0
build_flags =
    -DMQTT_MAX_PACKET_SIZE=2048
    -DFW_VERSION=\"0.2.0\"
    -DAPI_HOST=\"tv.sun-hunter.men\"

[env:d1_mini]
platform = espressif8266
framework = ${arduino.framework}
lib_deps = ${arduino.lib_deps}
board = d1_mini
board_build.filesystem = littlefs
build_flags = ${arduino.build_flags} -DPORTAL_PIN=14   ; D5: замкнути на GND при старті -> портал
extra_scripts = post:sign.py                          ; підписаний образ для OTA: .pio/build/d1_mini/firmware.bin.signed

[env:esp32dev]
platform = espressif32
framework = ${arduino.framework}
lib_deps = ${arduino.lib_deps}
board = esp32dev
board_build.filesystem = littlefs
build_flags = ${arduino.build_flags} -DPORTAL_PIN=0    ; кнопка BOOT

[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter = +<solarman_v5.cpp>
